<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Test</title>
<style>
body { background:#111; color:#fff; font-family:monospace; padding:20px; }
.ok { color:#27ae60; }
.err { color:#e74c3c; }
.warn { color:#f39c12; }
pre { background:#222; padding:12px; border-radius:6px; font-size:12px; overflow-x:auto; white-space:pre-wrap; margin:8px 0; }
h2 { color:#c8a96e; margin-top:20px; }
</style>
</head>
<body>
<h1>🔍 Barber Gent – Debug</h1>
<p id="status">Lädt...</p>
<div id="output"></div>

<script>
const SHEET_ID = "1VX_5m_Utycg2_v6NTZoCPC9NCYHHFbDBRYeTgGxiFlU";

function log(msg, type="") {
  const d = document.createElement("pre");
  d.className = type;
  d.textContent = msg;
  document.getElementById("output").appendChild(d);
}

function h(t) {
  const el = document.createElement("h2");
  el.textContent = t;
  document.getElementById("output").appendChild(el);
}

async function testSheet(name) {
  h("Sheet: " + name);
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(name);
  log("URL: " + url);
  try {
    const res = await fetch(url);
    log("HTTP Status: " + res.status + " " + res.statusText, res.ok ? "ok" : "err");
    const text = await res.text();
    log("Response (erste 300 Zeichen):\n" + text.substring(0, 300));
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) {
      log("❌ Kein gviz Response gefunden!", "err");
      return;
    }
    const json = JSON.parse(match[1]);
    if (!json.table || !json.table.rows) {
      log("❌ Keine Tabelle / Rows im Response", "err");
      log(JSON.stringify(json).substring(0, 300), "warn");
      return;
    }
    const rows = json.table.rows.filter(r => r.c && r.c[5] && r.c[6]);
    log("✅ Rows gesamt: " + json.table.rows.length + " | Rows mit Datum+Zeit: " + rows.length, "ok");
    if (rows.length > 0) {
      const sample = rows.slice(0,3).map(r => {
        const f = r.c[5]; const g = r.c[6];
        return "Datum: " + JSON.stringify(f) + " | Zeit: " + JSON.stringify(g);
      }).join("\n");
      log("Erste 3 Einträge:\n" + sample, "ok");
    }
  } catch(e) {
    log("❌ Fetch Fehler: " + e.message, "err");
  }
}

async function run() {
  const today = new Date();
  log("Heute: " + today.toLocaleDateString("de-DE") + " | getMonth(): " + today.getMonth() + " (0=Jan, 5=Jun, 6=Jul)");
  
  const maxDate = new Date(today.getFullYear(), today.getMonth() + 2, 0);
  maxDate.setHours(23,59,59,999);
  log("maxDate: " + maxDate.toLocaleDateString("de-DE"));

  await testSheet("Juni");
  await testSheet("Juli");
  await testSheet("August");
  
  document.getElementById("status").textContent = "✅ Test abgeschlossen";
}

run();
</script>
</body>
</html>
